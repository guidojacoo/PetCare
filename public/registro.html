<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetCare • Crear cuenta</title>
  <link rel="stylesheet" href="registro.css">
</head>
<body>
  <main class="phone">
    <header class="topbar">Logo • petcare</header>

    <section class="content">
      <h2 class="title">Crear cuenta en Petcare</h2>
      <p class="muted">¿Ya tenes cuenta? <a class="link" href="login.html">Iniciar sesión</a></p>

      <label class="label">Nombre*</label>
      <input class="input" type="text" placeholder="Campo de texto">

      <label class="label">Mail*</label>
      <input class="input" type="email" placeholder="Campo de texto">

      <label class="label">Contraseña*</label>
      <input class="input" type="password" placeholder="Campo de texto">

      <label class="label">Confirmar contraseña*</label>
      <input class="input" type="password" placeholder="Campo de texto">

      <a class="btn btn-orange full" href="mascota.html">Registrarse</a>
    </section>
  </main>
</body>
</html>
