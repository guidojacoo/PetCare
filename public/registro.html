<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetCare • Crear cuenta</title>
  <link rel="stylesheet" href="registro.css">
  <script src="inicio.js"></script>
</head>
<body>
  <main class="phone">
    <header class="topbar">Logo • petcare</header>

    <section class="content">
      <h2 class="title">Crear cuenta en Petcare</h2>
      <p class="muted">¿Ya tenes cuenta? <a class="link" href="login.html">Iniciar sesión</a></p>

      <label class="label" for="nombre">Nombre*</label>
    <input id="nombre" class="input" type="text" placeholder="Campo de texto">

    <label class="label" for="email">Mail*</label>
    <input id="email" class="input" type="email" placeholder="Campo de texto">

    <label class="label" for="contrasena">Contraseña*</label>
    <input id="contrasena" class="input" type="password" placeholder="Campo de texto">

<label class="label" for="confirmar">Confirmar contraseña*</label>
<input id="confirmar" class="input" type="password" placeholder="Campo de texto">


      <a class="btn btn-orange full" href="mascota.html">Registrarse</a>
    </section>
  </main>
</body>
</html>
