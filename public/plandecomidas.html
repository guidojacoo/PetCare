<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Plan Semanal - PetCare</title>
</head>
<body>
  <h1>Plan Semanal - PetCare</h1>

  <form id="weekForm">
    <label for="grams">Gramos por comida:</label>
    <input type="number" id="grams" name="grams" min="10" step="5" required>

    <p>Ingresá horarios por día en formato HH:MM separados por coma. Ej: <code>08:00, 13:30, 20:00</code></p>

    <label>Lunes:</label>
    <input type="text" id="mon" placeholder="08:00, 20:00">

    <label>Martes:</label>
    <input type="text" id="tue" placeholder="08:00, 20:00">

    <label>Miércoles:</label>
    <input type="text" id="wed" placeholder="08:00, 20:00">

    <label>Jueves:</label>
    <input type="text" id="thu" placeholder="08:00, 20:00">

    <label>Viernes:</label>
    <input type="text" id="fri" placeholder="08:00, 20:00">

    <label>Sábado:</label>
    <input type="text" id="sat" placeholder="09:00">

    <label>Domingo:</label>
    <input type="text" id="sun" placeholder="09:00">

    <button type="submit">Guardar Plan Semanal</button>
  </form>

  <p id="response"></p>

  <script>
    function parseTimes(text) {
      if (!text) return [];
      return text.split(",")
                 .map(s => s.trim())
                 .filter(s => /^\d{2}:\d{2}$/.test(s));
    }

    document.getElementById("weekForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const grams = parseInt(document.getElementById("grams").value);
      const secondsOpen = grams / 10;

      // Orden: Lunes..Domingo (ISO-8601 1..7)
      const weekplan = [
        parseTimes(document.getElementById("mon").value),
        parseTimes(document.getElementById("tue").value),
        parseTimes(document.getElementById("wed").value),
        parseTimes(document.getElementById("thu").value),
        parseTimes(document.getElementById("fri").value),
        parseTimes(document.getElementById("sat").value),
        parseTimes(document.getElementById("sun").value),
      ];

      const data = { secondsOpen, weekplan };

      console.log("Plan semanal enviado:", data);

      try {
        const res = await fetch("/setPlan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        const msg = await res.text();
        document.getElementById("response").innerText = "Respuesta: " + msg;
      } catch (err) {
        document.getElementById("response").innerText = "Error al enviar datos";
      }
    });
  </script>
</body>
</html>
