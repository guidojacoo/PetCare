<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Plan de Comidas - PetCare</title>
</head>
<body>
  <h1>Plan de Comidas - PetCare</h1>

  <form id="foodForm">
    <label for="grams">Gramos por comida:</label>
    <input type="number" id="grams" name="grams" min="10" step="5" required>

    <label for="meals">Cantidad de comidas al día:</label>
    <select id="meals" name="meals" required>
      <option value="2">2 comidas</option>
      <option value="3">3 comidas</option>
      <option value="4">4 comidas</option>
    </select>

    <div id="mealTimes"></div>

    <button type="submit">Guardar Plan</button>
  </form>

  <p id="response"></p>

  <script>
    const mealsSelect = document.getElementById("meals");
    const mealTimesDiv = document.getElementById("mealTimes");

    // Generar inputs de hora según comidas seleccionadas
    mealsSelect.addEventListener("change", () => {
      mealTimesDiv.innerHTML = ""; // limpiar
      const meals = parseInt(mealsSelect.value);

      for (let i = 0; i < meals; i++) {
        const label = document.createElement("label");
        label.textContent = `Hora comida ${i+1}:`;

        const input = document.createElement("input");
        input.type = "time";
        input.required = true;
        input.name = "time" + i;

        mealTimesDiv.appendChild(label);
        mealTimesDiv.appendChild(input);
        mealTimesDiv.appendChild(document.createElement("br"));
      }
    });

    // Inicializar con 2 comidas por defecto
    mealsSelect.dispatchEvent(new Event("change"));

    document.getElementById("foodForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const grams = parseInt(document.getElementById("grams").value);
      const meals = parseInt(mealsSelect.value);

      // 10g = 1 seg (ejemplo)
      const secondsOpen = grams / 10;

      const times = [];
      const inputs = mealTimesDiv.querySelectorAll("input[type=time]");
      inputs.forEach(inp => times.push(inp.value));

      const data = { grams, meals, secondsOpen, times };

      console.log("Datos enviados al ESP32:", data);

      try {
        const res = await fetch("/setPlan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        const msg = await res.text();
        document.getElementById("response").innerText = "Respuesta: " + msg;
      } catch (err) {
        document.getElementById("response").innerText = "Error al enviar datos";
      }
    });
  </script>
</body>
</html>
