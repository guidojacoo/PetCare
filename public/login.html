<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetCare • Iniciar sesión</title>
  <link rel="stylesheet" href="login.css">
  <script src="inicio.js"></script>
</head>
<body>
  <main class="phone">
    <header class="topbar">
      <h1 class="logo-text">PetCare</h1>
    </header>

    <section class="content">
      <h2 class="title">Inicia sesión en PetCare</h2>
      <p class="muted">¿Es tu primera vez? 
        <a class="link" href="registro.html">Regístrate</a>
      </p>

      <label class="label">Mail*</label>
      <input class="input" type="email" placeholder="ejemplo@mail.com">

      <label class="label">Contraseña*</label>
      <input class="input" type="password" placeholder="********">

      <button class="btn btn-accent full" id="btn-login" type="button">Iniciar sesión</button>
    </section>
  </main>
</body>
</html>
