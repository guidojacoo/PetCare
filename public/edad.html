<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Añadir mascota • Edad</title>
  <link rel="stylesheet" href="edad.css" />
</head>
<body>
  <main class="phone">
    <header class="topbar">
      <a class="back" href="raza.html" aria-label="Volver">‹</a>
      <span>Añadir mascota</span>
      <span></span>
    </header>

    <section class="content">
      <h2 class="title">Elegí su cumpleaños</h2>
      <p class="muted">Elegir una raza puede ayudar a distinguir características especiales de tu mascota</p>

      <div class="underline-input">
        <input type="text" placeholder="Campo de texto" />
      </div>

      <div class="picker">
        <div class="col"><span class="arrow">↑</span><span>Meses</span><span class="arrow">↓</span></div>
        <div class="col"><span class="arrow">↑</span><span>Días</span><span class="arrow">↓</span></div>
        <div class="col"><span class="arrow">↑</span><span>Año</span><span class="arrow">↓</span></div>
        <button class="mic" aria-label="Dictar">🎤</button>
      </div>

      <div class="actions">
        <a class="btn btn-orange" href="index.html">Siguiente</a>
        <a class="btn btn-cyan" href="index.html">Salir</a>
      </div>
    </section>
  </main>
</body>
</html>
