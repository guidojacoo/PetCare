<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PetCare</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="pantalla activa" id="pantalla-inicio">
    <div class="caja-inicio">
      <h1>Inicio sesión</h1>
      <input type="text" id="usuario-login" placeholder="Usuario o email">
      <small id="mensaje-login" class="error"></small>
  
      <button onclick="iniciarSesion()">Continuar</button>
      <button onclick="mostrar('pantalla-registro')">Crear cuenta</button>
    </div>
  </div>
  
  <div class="pantalla" id="pantalla-registro">
    <div class="caja-registro">
      <h2>Logo</h2>
      <p>Eslógan</p>

      <input type="text" id="nombre" placeholder="Nombre">
      <small class="error" id="error-nombre"></small>

      <input type="text" id="email" placeholder="Email">
      <small class="error" id="error-email"></small>

      <div class="input-contenedor">
        <input type="password" id="contrasena" placeholder="Contraseña">
        <span class="icono-ojo" onclick="togglePassword('contrasena', this)">👁️</span>
      </div>
      <small class="error" id="error-contrasena"></small>

      <div class="input-contenedor">
        <input type="password" id="confirmar" placeholder="Confirmar contraseña">
        <span class="icono-ojo" onclick="togglePassword('confirmar', this)">👁️</span>
      </div>
      <small class="error" id="error-confirmar"></small>

      <button type="button" onclick="registrarse()">Continuar</button>
      <div id="mensaje-exito" class="mensaje-exito"></div>
    </div>
  </div>

  <div class="pantalla" id="pantalla-principal">
    <div class="top-buttons">
      <button>Botón AJUS.</button>
      <button>Botón IA</button>
    </div>

<div class="camera">
  <img id="camara-stream" 
       src="http://192.168.0.244:81/stream" 
       style="width:100%; height:100%; object-fit:cover; border-radius:8px;" 
       alt="Cámara en vivo">
</div>
<div>
<button onclick="moverServo()" style="margin-top:10px; padding:10px 20px; font-size:16px;">
  Activar Servo
</button>

<script>
  function moverServo() {
    fetch("http://192.168.0.244:8080/servo")
      .then(r => r.text())
      .then(t => console.log(t));
  }
</script>
</div>

    <div class="botones-sec">
      <button>Botón MIC</button>
      <button onclick="mostrar('pantalla-alimento')">Botón Premio</button>
      <button>Botón Alim. Rápida</button>
    </div> 
  </div>

  <div class="pantalla" id="pantalla-alimento">
    <div class="top-buttons">
      <button>Botón AJUS.</button>
      <button>Botón IA</button>
    </div>
    <p>Texto</p>
    <div class="fila">
      <div class="circulo">Botón</div>
      <div class="circulo">Botón</div>
    </div>
    <div class="botones-sec">
      <button>Botón MIC</button>
      <button>Botón Premio</button>
      <button onclick="mostrar('pantalla-principal')">Volver</button>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
