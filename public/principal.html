<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patalla principal</title>
  <link rel="stylesheet" href="principal.css">
</head>
<body>

  <main class="phone">
    <header class="top">
      <a href="perfil.html" class="btn btn-gear" aria-label="Configuración">⚙️</a>      <div class="dot"></div>
    </header>

    <section class="camera">
      <img id="camara-stream" 
           src="http://192.168.0.244:81/stream" 
           style="width:200px; height:200px;border-radius:8px;" 
           alt="Cámara en vivo">
  </section>
    
    
    
    <script>
      function moverServo() {
        fetch("http://192.168.0.244:8080/servo")   
          .then(r => r.text())
          .then(t => console.log(t));
      }
    </script>
    

    <div class="bottom-actions">
      <button class="fab" aria-label="Micrófono silenciado">🔇</button>
      <button onclick="moverServo()"class="fab"> 🐾 </button>
      <button class="fab" id = "plan" aria-label="Tomar foto">📸</button>
    </div>
    <script>

document.getElementById("plan").addEventListener("click", (e) => {
      e.preventDefault();
      window.location.href = "plandecomidas.html";
    });

      (function () {
        try {
          const u = JSON.parse(localStorage.getItem("usuario"));
          if (!u || !u.id) {
            window.location.replace("index.html");
          }
        } catch (_) {
          window.location.replace("index.html");
        }
      })();
    </script>
  </main>

</body>
</html>
