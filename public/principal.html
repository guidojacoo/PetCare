<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Patalla principal</title>
  <link rel="stylesheet" href="principal.css">
</head>
<body>

  <main class="phone">
    <header class="top">
      <a href="perfil.html" class="btn btn-gear" aria-label="Configuración">⚙️</a>      
      <div class="dot"></div>
    </header>

    <section class="camera">
      <img id="camara-stream" 
           src="http://192.168.0.244:81/stream" 
           style="width:200px; height:200px;border-radius:8px;" 
           alt="Cámara en vivo">
    </section>
    
    <script>
      function moverServo() {
        fetch("http://192.168.0.244:8080/servo")   
          .then(r => r.text())
          .then(t => console.log(t));
      }
    </script>

    <div class="bottom-actions">
      <button class="fab" id="mic" aria-label="Micrófono silenciado" data-state="off">
        <img class="mic-img" src="../micDesactivado.png" alt="Imagen de un microfono">
      </button>
      <button onclick="moverServo()" class="fab"> 🐾 </button>
      <button class="fab" id="plan" aria-label="Tomar foto"><img src=".../Fotos/Notas.png" alt="Imagen de unas notas"></button>
    </div>

    <div id="mic-toast">microfono activo</div>

    <script>
      document.getElementById("plan").addEventListener("click", (e) => {
        e.preventDefault();
        window.location.href = "plandecomidas.html";
      });

      (function () {
        try {
          const u = JSON.parse(localStorage.getItem("usuario"));
          if (!u || !u.id) {
            window.location.replace("index.html");
          }
        } catch (_) {
          window.location.replace("index.html");
        }
      })();

      let micBtn = document.getElementById("mic");
      let micImg = micBtn.querySelector(".mic-img");
      let toast = document.getElementById("mic-toast");
      let hideTimer = null;

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.remove("show");
        void toast.offsetWidth;
        toast.classList.add("show");
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = setTimeout(() => { toast.classList.remove("show"); }, 2000);
      }

      micBtn.addEventListener("click", () => {
        let state = micBtn.getAttribute("data-state");
        if (state === "off") {
          micBtn.setAttribute("data-state", "on");
          micImg.src = "../micActivado.png";
          showToast("Tu perro te esta escuchando");
        } else {
          micBtn.setAttribute("data-state", "off");
          micImg.src = "../micDesactivado.png";
          showToast("Tu perro no te esta escuchando");
        }
      });
    </script>
  </main>

</body>
</html>
