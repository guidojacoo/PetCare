<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pantalla principal</title>
  <link rel="stylesheet" href="principal.css">
  <!-- AGREGADO: estilo para grisear botón de cámara cuando está deshabilitado -->
  <style>
    .fab.disabled {
      filter: grayscale(1);
      opacity: .45;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main class="phone">
    <header class="top">
      <a href="perfil.html" class="btn btn-gear" aria-label="Configuración">
        <img src="/Fotos/configuracion.png" alt="Configuración" height="40" width="40">
      </a>
      <div class="dot" aria-label="Inicial del usuario"></div>
    </header>

    <!-- Cámara -->
    <section class="camera">
      <img id="camara-stream" alt="Cámara en vivo" style="display:none;">
    </section>

    <!-- Mensaje debajo del rectángulo -->
    <div id="mic-toast"></div>

    <!-- Acciones -->
    <div class="bottom-actions">
      <!-- Botón ahora es bocina: imagen fija (imagenes/sonido.png) y tamaño como los demás -->
      <button class="fab" id="mic" aria-label="Bocina apagada" data-state="off" type="button">
        <img class="mic-img" src="imagenes/sonido.png" alt="Bocina" height="40" width="40">
      </button>
      <button onclick="moverServo()" class="fab">
        <img src="/Fotos/PataDePerro.png" alt="Pata" height="40" width="50">
      </button>
      <button class="fab" id="plan" aria-label="Plan de comidas">
        <img src="/Fotos/Notas.png" alt="Imagen de unas notas" height="40" width="40">
      </button>
      <!-- El botón de cámara se agrega por JS -->
    </div>

    <script>
      // ====================== MIGRACIÓN DE SESIÓN (usuario -> petcare_user) ======================
      (function migrateSessionKey(){
        try {
          const NEW_KEY = "petcare_user";
          const OLD_KEY = "usuario";
          const newVal = localStorage.getItem(NEW_KEY);
          const oldVal = localStorage.getItem(OLD_KEY);
          if (!newVal && oldVal) {
            // Si existe la vieja sesión, la copiamos a la nueva clave
            localStorage.setItem(NEW_KEY, oldVal);
            // Opcional: limpiamos la vieja para evitar ambigüedades
            localStorage.removeItem(OLD_KEY);
          }
        } catch(e) {}
      })();
    </script>

    <script>
      // ====================== IPs ======================
      const CTRL_IP = "192.168.0.125";
      const CAM_IP  = "172.20.10.5";

      const STREAM_URL = `http://${CAM_IP}:81/stream`;
      const SERVO_URL  = `http://${CTRL_IP}:8080/servo`;
      const BUZZER_URL = `http://${CTRL_IP}:8080/buzzer`;
      // ÚNICO estado del controlador que consultamos
      const CTRL_STATUS_URL = `http://${CTRL_IP}:8080/status`;

      const img = document.getElementById("camara-stream");

      // Botón cámara (inyectado)
      const camBtn = document.createElement("button");
      camBtn.id = "cam-toggle";
      camBtn.className = "fab off";
      camBtn.setAttribute("aria-label","Encender/Apagar cámara");

      const camIcon = document.createElement("img");
      camIcon.alt = "Prendido/Apagado";
      camIcon.loading = "lazy";
      camIcon.decoding = "async";
      function setCamIconSrc() {
        const ver = Date.now();
        camIcon.src = `imagenes/prendido.png?v=${ver}`;
        camIcon.onerror = () => { camIcon.src = `/imagenes/prendido.png?v=${ver}`; };
      }
      setCamIconSrc();
      camBtn.appendChild(camIcon);

      document.addEventListener("DOMContentLoaded", () => {
        const cont = document.querySelector(".bottom-actions");
        if (cont && !document.getElementById("cam-toggle")) cont.appendChild(camBtn);
      });

      /* ===== Candado de cámara (lock) ===== */
      let camLocked = false;            // estado actual (si está bloqueada)
      let manualLockUntil = 0;          // bloqueo temporal por acción local (ms epoch)

      function setCamLock(locked, reason = ''){
        camLocked = !!locked;
        const btn = document.getElementById('cam-toggle');
        if (!btn) return;
        btn.disabled = camLocked;
        btn.classList.toggle('disabled', camLocked);
        btn.title = camLocked
          ? (reason || 'Cámara deshabilitada por acción/plan')
          : 'Encender/Apagar cámara';
        if (camLocked) { hideStream(); }  // si se bloquea, dejamos de pedir el stream
      }
      function lockFor(ms, reason = 'Ejecutando acción'){
        manualLockUntil = Date.now() + Math.max(0, ms|0);
        setCamLock(true, reason);
      }
      function manualLockActive(){
        return Date.now() < manualLockUntil;
      }

      async function showStream() {
        // no encender si está bloqueada
        if (camLocked) return;
        img.style.display = "block";
        img.src = STREAM_URL;           // empezar a pedir el stream
        camBtn.classList.remove("off");
        camBtn.classList.add("on");
      }

      async function hideStream() {
        // dejar de pedir el stream
        img.style.display = "none";
        img.removeAttribute("src");
        camBtn.classList.remove("on");
        camBtn.classList.add("off");
      }

      // click respeta el lock
      camBtn.addEventListener("click", () => {
        if (camLocked) return;
        camBtn.classList.contains("off") ? showStream() : hideStream();
      });

      async function moverServo() {
        // bloqueo corto y corte de stream antes de accionar
        lockFor(4000, 'Servo en curso');
        await hideStream();
        fetch(SERVO_URL).catch(err => console.error("Error servo:", err));
        // opcional: reintentar encender luego de 1 min
        // setTimeout(() => { if (!camLocked) showStream(); }, 60000);
      }

      window.moverServo = moverServo;
      window.showStream = showStream;
      window.hideStream = hideStream;
    </script>

    <script>
      // ====================== Navegación y sesión ======================
      document.getElementById("plan").addEventListener("click", (e) => {
        e.preventDefault();
        window.location.href = "plandecomidas.html";
      });

      (function enforceSessionOrHome() {
        try {
          // 🔴 Unificado: usamos SIEMPRE petcare_user
          const u = JSON.parse(localStorage.getItem("petcare_user"));
          if (!u || !u.id) {
            // Si no hay sesión, volvemos a la portada
            window.location.replace("index.html");
          }
        } catch (_) {
          window.location.replace("index.html");
        }
      })();

      // Toast debajo de la cámara (reutiliza showToast y comportamiento visual)
      const micBtn  = document.getElementById("mic");
      const toast   = document.getElementById("mic-toast");
      let hideTimer = null;

      function showToast(text, isOn=true, ms=2000) {
        if (!toast) return;
        toast.textContent = text;
        toast.classList.toggle("off", !isOn);
        toast.classList.remove("show");
        void toast.offsetWidth;
        toast.classList.add("show");
        if (hideTimer) clearTimeout(hideTimer);
        hideTimer = setTimeout(() => toast.classList.remove("show"), ms);
      }

      // comportamiento sencillo de bocina (UN SOLO MODO).
      // Al tocar siempre muestra "Bocina Activada" y desaparece después.

      // ... (lock y corte de stream antes de accionar)
      if (micBtn) {
        micBtn.addEventListener("click", async () => {
          // bloqueo corto durante el inicio de la acción
          lockFor(3000, 'Bocina en curso');

          micBtn.setAttribute("data-state", "on");
          micBtn.setAttribute("aria-label", "Bocina activada");
          micBtn.classList.add("active");

          await hideStream(); // dejamos de pedir el stream
          fetch(BUZZER_URL, { method: "POST" })
            .catch(err => console.error("Error buzzer:", err));

          showToast(" Bocina Activada", true, 2500);
        });
      }
    </script>

    <!-- Auto-mostrar cámara 10 min tras finalizar la ventana del sensor -->
    <script>
      (function(){
        const AUTO_CAM_MS = 600000; // 10 min
        const POLL_MS = 1500;
        const STATUS_URL = `http://${CTRL_IP}:8080/status`;

        let prevEatWaiting = null;
        let autoOpened = false;
        let userTouched = false;
        let hideTimer = null;

        function getCamBtn() { return document.getElementById('cam-toggle'); }
        function isCamOn()   { const b=getCamBtn(); return b && b.classList.contains('on'); }
        function ensureUserIntentHook() {
          const btn = getCamBtn(); if (!btn) return false;
          if (!btn.__userHooked) { btn.addEventListener('click', () => { userTouched = true; }); btn.__userHooked = true; }
          return true;
        }

        async function pollStatus() {
          try {
            const res = await fetch(STATUS_URL);
            if (!res.ok) return;
            const st = await res.json();
            if (!st || !st.ok) return;

            const nowEatWaiting = !!st.eat_waiting;

            if (prevEatWaiting === true && nowEatWaiting === false) {
              if (!isCamOn() && typeof window.showStream === 'function') {
                window.showStream();
                autoOpened = true;
                userTouched = false;

                if (hideTimer) clearTimeout(hideTimer);
                hideTimer = setTimeout(() => {
                  if (autoOpened && !userTouched && isCamOn() && typeof window.hideStream === 'function') {
                    window.hideStream();
                  }
                  autoOpened = false;
                }, AUTO_CAM_MS);
              } else {
                autoOpened = false;
              }
            }
            prevEatWaiting = nowEatWaiting;
          } catch (_) {}
        }

        function start() {
          if (!getCamBtn()) { setTimeout(start, 300); return; }
          ensureUserIntentHook();
          setInterval(pollStatus, POLL_MS);
        }
        document.addEventListener('DOMContentLoaded', start);
      })();
    </script>

    <script>
      // ====================== Inicial del usuario en .dot ======================
      (function () {
        function pickInitial(user) {
          if (!user || typeof user !== "object") return "";
          const name = user.nombre || user.name || user.username ||
                       (user.email ? user.email.split("@")[0] : "");
          if (!name || typeof name !== "string") return "";
          const first = name.trim().charAt(0);
          return first ? first.toLocaleUpperCase("es-AR") : "";
        }
        document.addEventListener("DOMContentLoaded", () => {
          const dot = document.querySelector(".dot");
          if (!dot) return;
          let u = null;
          try { u = JSON.parse(localStorage.getItem("petcare_user")); } catch (e) {} // 🔴 clave unificada
          const initial = pickInitial(u) || "U";
          dot.textContent = initial;
          dot.setAttribute("title", `Usuario: ${initial}`);
        });
      })();
    </script>

    <!-- REEMPLAZADO: poller combinado que decide el lock usando SOLO /status del controlador -->
    <script>
      (function(){
        const CTRL_STATUS_URL = `http://${CTRL_IP}:8080/status`;

        async function readJSONSafe(url){
          try{
            const r = await fetch(url);
            if(!r.ok) return null;
            return await r.json();
          }catch(_){ return null; }
        }

        function computeAndApplyLock(ctrlSt){
          const manual = (typeof manualLockActive === 'function') ? manualLockActive() : false;
          const plan   = !!(ctrlSt && (ctrlSt.eat_waiting === true));   // ventana de comida/plan en curso
          const shouldLock = manual || plan;

          if (typeof setCamLock === 'function') {
            if (shouldLock) {
              const reason =
                manual ? 'Ejecutando acción' :
                         'Ejecutando plan';
              setCamLock(true, reason);
            } else {
              setCamLock(false);
            }
          }
        }

        async function refreshCamState(){
          const ctrlSt = await readJSONSafe(CTRL_STATUS_URL);
          computeAndApplyLock(ctrlSt);
        }

        document.addEventListener('DOMContentLoaded', () => {
          refreshCamState();
          setInterval(refreshCamState, 1200);
        });
      })();
    </script>

    <!-- AGREGADO: cortar stream al salir/ocultar la página (fuera de principal no se pide) -->
    <script>
      window.addEventListener('pagehide',    () => { try{ hideStream(); }catch(_){} });
      window.addEventListener('beforeunload',() => { try{ hideStream(); }catch(_){} });
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { try{ hideStream(); }catch(_){} }
      });
    </script>

  </main>

  <script src="theme-toggle.js" defer></script>

</body>
</html>
