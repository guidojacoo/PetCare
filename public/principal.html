<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tutorial 1</title>
  <link rel="stylesheet" href="principal.css">
</head>
<body>

  <main class="phone">
    <button class="fab fab-gear" aria-label="Ajustes">⚙️</button>


    <div class="camera">
      <img id="camara-stream" 
           src="http://192.168.0.244:81/stream" 
           style="width:200px; height:200px;border-radius:8px;" 
           alt="Cámara en vivo">
    </div>
    
    <div>
      <button onclick="moverServo()" style="margin-top:10px; padding:10px 20px; font-size:16px;">
        Activar Servo
      </button>
    </div>
    
    <script>
      function moverServo() {
        fetch("http://192.168.0.244:8080/servo")   
          .then(r => r.text())
          .then(t => console.log(t));
      }
    </script>
    

    <div class="bottom-actions">
      <button class="fab" aria-label="Micrófono silenciado">🔇</button>
      <button class="fab" aria-label="Premio / Huella">🐾</button>
      <button class="fab" aria-label="Tomar foto">📸</button>
    </div>
  </main>

</body>
</html>
