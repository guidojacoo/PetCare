<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Añadir mascota • Peso</title>
  <link rel="stylesheet" href="peso.css" />
</head>
<body>
  <main class="phone">
    <header class="topbar">
      <a class="back" href="sexo.html" aria-label="Volver">‹</a>
      <span>Añadir mascota</span>
      <span></span>
    </header>

    <section class="content">
      <h2 class="title">Elegí un peso</h2>
      <p class="muted">Seleccioná el peso para poder ajustar las cantidades de alimento correctas</p>

      <label class="label">Peso (kg)</label>
      <div class="chips" id="peso-chips">
        <button class="chip" data-peso="5">5 kg</button>
        <button class="chip" data-peso="10">10 kg</button>
        <button class="chip" data-peso="20">20 kg</button>
        <button class="chip" data-peso="40">40 kg</button>
      </div>

      <div class="underline-input">
        <input id="peso-custom" type="number" step="0.1" min="0" placeholder="Otro peso (opcional)">
      </div>

      <div class="actions">
        <button class="btn btn-orange" id="btn-peso-next" type="button">Siguiente</button>
        <a class="btn btn-cyan" href="index.html">Salir</a>
      </div>
    </section>
  </main>

  <script src="onboarding.js"></script>
</body>
</html>
