<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PetCare • Nueva Mascota</title>
  <link rel="stylesheet" href="mascota.css">
</head>
<body>
  <main class="phone">
    <header class="topbar">
      <h1 class="title">Crear Mascota</h1>
    </header>

    <section class="content">

      <!-- Paso 1 -->
      <div class="step active" id="step-1">
        <h2>¿Cómo se llama tu perro?</h2>
        <input type="text" id="nombre" placeholder="Ej: Firulais">
        <button class="btn next" data-next="2">Siguiente</button>
      </div>

      <!-- Paso 2 -->
      <div class="step" id="step-2">
        <h2>Sexo</h2>
        <div class="chips">
          <button class="chip" data-sexo="Macho">Macho</button>
          <button class="chip" data-sexo="Hembra">Hembra</button>
        </div>
        <button class="btn next" data-next="3">Siguiente</button>
      </div>

      <!-- Paso 3 -->
      <div class="step" id="step-3">
        <h2>Peso en kilogramos</h2>
        <input type="number" id="peso" placeholder="Ej: 15">
        <button class="btn next" data-next="4">Siguiente</button>
      </div>

      <!-- Paso 4 -->
      <div class="step" id="step-4">
        <h2>Raza</h2>
        <input type="text" id="raza" placeholder="Ej: Labrador">
        <button class="btn next" data-next="5">Siguiente</button>
      </div>

      <!-- Paso 5 -->
      <div class="step" id="step-5">
        <h2>Fecha de Nacimiento</h2>
        <input type="date" id="fecha">
        <button class="btn next" data-next="6">Siguiente</button>
      </div>

      <!-- Paso 6 -->
      <div class="step" id="step-6">
        <h2>¿Cuántas calorías tiene el alimento?</h2>
        <label for="kcal">Indica las kcal por cada 100 g (dato en el paquete)</label>
        <input type="number" id="kcal" placeholder="Ej: 350" min="200" max="600">
        <button class="btn finish">Finalizar</button>
      </div>

    </section>
<div id="msg-overlay" class="overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true">
    <p id="msg-text" style="font-size:18px; text-align:center; margin:20px 0;"></p>
    <div style="text-align:center;">
      <button id="msg-close" class="btn btn-danger">Cerrar</button>
    </div>
  </div>
</div>

<style>
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }
  .overlay.active { display: flex; }
  .modal {
    background: #fff;
    border-radius: 10px;
    padding: 20px 30px;
    max-width: 400px;
    width: 90%;
    text-align: center;
  }
</style>

  </main>

  <script src="mascota.js"></script>
  <script src="theme-toggle.js" defer></script>

</body>
</html>
